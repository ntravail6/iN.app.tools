<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>お問い合わせ｜YOUR TRAVELS</title><link rel="icon" href="images/icon.png"><link rel="stylesheet" href="fonts.css">
<style>
  :root {
    /* アプリの「世界」の画面と同じ書体にそろえる */
    --font: 'Futura', 'Futura PT', 'Futura Std', 'Jost', 'Kosugi Maru',
            'Century Gothic', 'Trebuchet MS', sans-serif;
    --font-logo: var(--font);
    --bg: #FBF6F0; --text: #4C3C30; --text-sub: #6E5A49; --text-muted: #9C8878;
    --border: rgba(90, 71, 56, 0.12); --border-strong: rgba(90, 71, 56, 0.22);
    --v3: #C5919D; --v4: #915666;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: var(--font); color: var(--text); background: var(--bg);
    font-size: 14.5px; line-height: 2.05; letter-spacing: 0.01em;
    padding: 44px 22px 72px; text-align: left; -webkit-font-smoothing: antialiased;
  }
  .page { max-width: 600px; margin: 0 auto; }

  /* 表紙 */
  /* 文章の中のアプリ名。ロゴのように字間は広げない */
  .nm { font-family: var(--font-logo); letter-spacing: 0.06em; font-weight: 500; }
  .logo { font-family: var(--font-logo); font-size: 15px; letter-spacing: 6px;
          color: var(--text-muted); font-weight: 400; }
  .logo em { font-style: normal; color: var(--v3); font-weight: 500; }
  h1 { font-size: 23px; font-weight: 600; letter-spacing: 0.02em; line-height: 1.5;
       margin: 10px 0 18px; }
  .lead { font-size: 14.5px; color: var(--text-sub); }

  /* 見出し。番号つきで、どこを読んでいるか分かるように */
  h2 { font-size: 17px; font-weight: 600; letter-spacing: 0.02em; line-height: 1.6;
       margin: 38px 0 12px; padding-top: 26px; border-top: 0.5px solid var(--border);
       display: flex; align-items: baseline; gap: 10px; }
  h2::before { content: ''; flex: none; width: 7px; height: 7px; border-radius: 50%;
               background: var(--v3); transform: translateY(-2px); }

  p { margin-bottom: 14px; }
  p:last-child { margin-bottom: 0; }
  b { font-weight: 600; }

  ul { list-style: none; margin: 12px 0 16px; }
  li { padding-left: 1.1em; position: relative; margin-bottom: 10px; }
  li::before { content: '・'; position: absolute; left: 0; color: var(--text-muted); }
  li:last-child { margin-bottom: 0; }

  /* 項目を書き出すところ。見出しと中身を縦に並べる */
  .item { margin: 16px 0; padding-left: 14px; border-left: 2px solid var(--border); }
  .item + .item { margin-top: 20px; }
  .item h3 { font-size: 15px; font-weight: 600; line-height: 1.6; margin-bottom: 6px; }
  .item dl { margin: 0; }
  .item dt { font-size: 12.5px; color: var(--text-muted); margin-top: 8px; line-height: 1.7; }
  .item dt:first-child { margin-top: 0; }
  .item dd { margin: 0; font-size: 14.5px; color: var(--text-sub); }

  a { color: var(--v4); text-underline-offset: 3px; }
  .btn { display: inline-block; margin-top: 6px; font-size: 14.5px; padding: 11px 22px;
         border: 0.5px solid var(--border-strong); border-radius: 100px;
         text-decoration: none; background: #fff; }

  footer { margin-top: 48px; padding-top: 24px; border-top: 0.5px solid var(--border-strong);
           font-size: 13px; color: var(--text-muted); }
  footer .f-copy { color: var(--text-sub); }
  footer p { margin-bottom: 6px; }

  @media (max-width: 400px) {
    body { font-size: 14.5px; padding: 36px 18px 60px; }
    h1 { font-size: 21px; }
    h2 { font-size: 16px; }
  }

  .langs{display:flex;gap:6px;margin-bottom:22px}
  .langs button{font:inherit;font-size:13px;padding:6px 16px;border:0.5px solid var(--border-strong);border-radius:100px;background:#fff;color:var(--text-sub);cursor:pointer}
  .langs button.on{background:var(--v4);color:#fff;border-color:var(--v4)}
  html.ja [data-l=en], html.en [data-l=ja]{display:none}
  .both [data-l=en]{margin-top:56px;padding-top:30px;border-top:1px solid var(--border-strong)}

.nav{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;margin-bottom:26px}.nav a{text-decoration:none;color:var(--text-muted)}.nav a:first-child{color:var(--v4);letter-spacing:.08em}
.hero{text-align:center;padding:36px 0 8px}.hero img{width:104px;height:104px;border-radius:24px;box-shadow:0 6px 22px rgba(90,71,56,.18)}
.hero h1{margin:22px 0 6px;font-size:26px;letter-spacing:.14em}.hero .sub{color:var(--text-sub);margin:0}
