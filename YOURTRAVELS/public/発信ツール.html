<title>発信ツール</title>
<style>
:root{color-scheme:light;--bg:#FBF7F2;--text:#4F4036;--muted:#6F6055;--accent:#8A5A6B;--line:#E6D9CC;--card:#fff;--y:#76604E;--t:#7A3E55;--ok:#3F6B4A;--ng:#B04A4A}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.7 "Hiragino Sans","Hiragino Kaku Gothic ProN",sans-serif;padding-bottom:env(safe-area-inset-bottom)}
button,input,select,textarea{font:inherit;color:inherit}
button{touch-action:manipulation;cursor:pointer;white-space:nowrap}
header{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.hd{display:flex;align-items:center;gap:6px;padding:8px 12px}
.hd h1{font-size:16px;margin:0;flex:1 1 auto;min-width:0;white-space:nowrap}
.hd select{min-height:38px;border:1px solid var(--line);border-radius:999px;padding:2px 10px;background:var(--card);font-size:14px;max-width:52vw;min-width:0;flex:0 1 auto;text-overflow:ellipsis}
.hd .btn{flex:none}
.tabs{display:flex;gap:2px;padding:0 10px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{border:0;background:none;padding:9px 14px;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap;font-size:14px;flex:none}
.tabs button.on{color:var(--text);font-weight:600;border-bottom-color:var(--accent)}
@media(max-width:560px){.tabs{display:flex}.tabs button{flex:1 1 0;display:flex;flex-direction:column;align-items:center;gap:0;padding:6px 2px 7px;font-size:12px;line-height:1.35}.tabs .tab-e{font-size:17px;line-height:1.3}}
.btn{min-height:40px;padding:6px 16px;border-radius:999px;border:1px solid var(--line);background:var(--card)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.sm{min-height:34px;padding:3px 12px;font-size:13px}
.btn.danger{color:var(--ng);border-color:#E3B8B8}
.pill{border-radius:999px;padding:1px 10px;font-size:12px;border:1px solid var(--line);background:var(--bg)}
.wrap{max-width:1120px;margin:0 auto;padding:12px 14px 90px}
.panel{display:none}.panel.on{display:block}
h2{font-size:16px;margin:22px 0 8px;padding-left:10px;border-left:4px solid var(--accent)}
.sec{padding:6px 0}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px 14px}
.nx{padding:10px 0;border-top:1px solid var(--line)}.nx:first-child{border-top:0}
.plist .prow{padding:9px 0;border-top:1px solid var(--line)}.plist .prow:first-child{border-top:0}
.acct{padding:4px 0 2px}
.note{color:var(--muted);font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ay{color:var(--y);font-weight:600}.at{color:var(--t);font-weight:600}
.empty{color:var(--muted);text-align:center;padding:26px 0}
.ok{color:var(--ok)}.ng{color:var(--ng)}
input[type=text],input[type=date],select.f,textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--bg);font-size:16px}
/* ホーム */
.grid2{display:grid;gap:12px}
@media(min-width:900px){.grid2{grid-template-columns:1fr 1fr}}
.next h3{font-size:13px;margin:0 0 3px;color:var(--accent)}
.next .t{font-weight:600}
.sum{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.sum span{font-size:13px;padding:0;white-space:nowrap}
@media(max-width:560px){.sum{display:grid;grid-template-columns:repeat(2,max-content);gap:2px 22px}}
.li{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li input[type=checkbox]{width:28px;height:28px;margin-top:0;flex:none;accent-color:var(--accent)}
.li .tx{flex:1}
.li .tx input[type=text]{border:0;border-bottom:1px solid var(--line);border-radius:0;background:none;padding:4px 0;margin-top:2px}
.li.done .tx{color:var(--muted);text-decoration:line-through}
.li .x{border:0;background:none;color:var(--muted);font-size:18px;min-width:44px;min-height:44px;margin:-6px -8px -6px 0}
.add{display:flex;gap:6px;margin-top:8px}.add input{flex:1}
.log{font-size:13px;color:var(--muted)}.log b{color:var(--text);font-weight:600}
/* 投稿 */
.pwrap{display:block}
@media(min-width:761px){.pwrap{display:grid;grid-template-columns:minmax(380px,480px) 1fr;gap:22px;align-items:start}.right{position:sticky;top:104px;max-height:calc(100vh - 120px);overflow:auto;overscroll-behavior:contain}}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 10px}
.filters select,.filters input{min-height:40px;border:1px solid var(--line);border-radius:10px;padding:4px 10px;background:var(--card);font-size:16px;width:auto}
.filters input{flex:1;min-width:140px}
.appsum{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 4px}
.appsum button{border:1px solid var(--line);background:none;border-radius:12px;padding:6px 12px;font-size:13px;text-align:left;line-height:1.5}
.appsum button.on{border-color:var(--accent);box-shadow:0 0 0 2px rgba(138,90,107,.18)}
.pc{padding:11px 8px;border-bottom:1px solid var(--line);cursor:pointer;border-radius:0}
.pc.sel{background:rgba(138,90,107,.09)}
.pc .top{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted);flex-wrap:wrap}
.pc .no{font-weight:700;color:var(--accent)}
.pc .ti{font-weight:600;margin:3px 0}
.pc .bo{font-size:13px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-line}
.pc .act{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.pl{font-size:11px;border:1px solid var(--line);border-radius:10px;padding:1px 8px}
.st{border-radius:999px;padding:1px 10px;font-size:12px;border:1px solid var(--line);background:var(--bg)}
.st.s2{background:#EFE6D8}.st.s3{border-color:var(--accent);color:var(--accent)}.st.s4{background:var(--line);border-color:var(--line);color:var(--muted);text-decoration:line-through}
.chk{font-size:12px}
.detail{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.detail label{display:block;font-size:12px;color:var(--muted);margin:12px 0 3px}
.detail textarea{min-height:120px;max-height:42vh;line-height:1.8;resize:vertical;overflow:auto}
.dh{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.dh .no{font-weight:700;color:var(--accent)}
.ti2{font-weight:600;margin:4px 0 2px}
.bar2{position:sticky;top:0;z-index:3;background:var(--card);padding:8px 0;margin:4px 0;display:flex;gap:8px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.row2{display:flex;gap:10px;flex-wrap:wrap}.row2>div{flex:1;min-width:140px}
.cnt{font-size:12px;color:var(--muted);text-align:right}.cnt.over{color:var(--ng);font-weight:700}
.checks{margin:10px 0;padding:4px 0 4px 12px;border-left:3px solid var(--line);font-size:13px}
.checks div{margin:2px 0}
details.more{margin-top:14px;border-top:1px solid var(--line);padding:0}
details.more summary{cursor:pointer;padding:10px 0;font-size:14px;color:var(--muted);list-style:none}
details.more summary::-webkit-details-marker{display:none}
details.more summary:before{content:'▸ ';color:var(--accent)}details.more[open] summary:before{content:'▾ '}
details.more[open]{padding-bottom:12px}
.close{display:none}
@media(max-width:760px){
  .right{position:fixed;inset:0;z-index:30;background:var(--bg);overflow:auto;transform:translateY(100%);transition:transform .2s;padding:10px 12px calc(40px + env(safe-area-inset-bottom));overscroll-behavior:contain}
  .right.open{transform:none}.close{display:inline-block;margin-bottom:8px}
}
/* 画像 */
.pk{display:flex;gap:5px;flex-wrap:wrap}
.pk button{min-height:34px;padding:3px 12px;font-size:13px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--muted)}
.pk button.on-use{background:var(--accent);border-color:var(--accent);color:#fff}
.pk button.on-maybe{background:var(--line);color:var(--text);border-color:var(--muted)}
.pk button.on-no{border-style:dashed;text-decoration:line-through}
.im{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.im:last-child{border-bottom:0}
/* 方針 */
.pol h3{font-size:15px;margin:20px 0 6px;padding-left:10px;border-left:4px solid var(--accent)}
.pol h4{font-size:14px;margin:14px 0 4px}
.pol table{border-collapse:collapse;width:100%;font-size:13px;display:block;overflow-x:auto}
.pol td,.pol th{border-bottom:1px solid var(--line);padding:6px;text-align:left;vertical-align:top}
.pol pre{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;white-space:pre-wrap;font-size:13px}
.pol code{background:var(--card);padding:0 5px;border-radius:5px;font-size:13px}
.pol .q{color:var(--muted);font-size:13px;margin:2px 0}
.pol ul{padding-left:1.2em}
.words span{display:inline-block;border:1px solid var(--line);border-radius:8px;padding:0 8px;margin:2px;background:var(--card);font-size:13px}
.sync{font-size:12px;white-space:nowrap;border:1px solid var(--line);border-radius:999px;padding:2px 10px;background:var(--card);color:var(--muted);flex:none}
.sync.off,.sync.conf{color:var(--ng);border-color:#E3B8B8}
@media(max-width:560px){.sync .st-t{display:none}.hd .sync{padding:0 10px}}
@media(max-width:399px){.hd .ht{display:none}}
@media(max-width:359px){.wrap .nx .row{flex-wrap:wrap}}
.sbanner{padding:10px 12px;border-left:3px solid var(--accent);margin:8px 0;font-size:14px}

<div class="ov" id="ov"><div class="box"><b>データ（JSON）</b><p class="note" style="margin:4px 0 8px">書き出し＝いまの内容をコピー。読み込み＝下の枠に貼って「読み込む」。全アカウントの内容が入ります。</p><textarea id="ta"></textarea><div class="row" style="margin-top:8px"><button class="btn sm pri" id="oCopy">いまの内容をコピー</button><button class="btn sm pri" id="oSaveF">⬇️ バックアップを保存（Claudeにも渡せます）</button><button class="btn sm pri" id="oShare" hidden>📤 共有して保存（スマホ）</button><button class="btn sm" id="oLoad">貼った内容を読み込む</button><button class="btn sm" id="oPrev">サーバーのひとつ前の内容を見る</button><button class="btn sm danger" id="oReset">このアカウントを最初に戻す</button><button class="btn sm" id="oClose">閉じる</button></div></div></div>

<script>
var DATA=window.TOOL_DATA||{};
var ACCS=Object.keys(DATA);
var STS=['案','下書き','投稿待ち','投稿済み','投稿しない'];
var SE={'案':'💭','下書き':'✏️','投稿待ち':'🕰️','投稿済み':'🌷','投稿しない':'🚫'};
var PE={'Threads':'🧵','Instagram':'📷','note':'📝','LINE':'💬'};
var KEY='hasshin-tool-v1';
function $(id){return document.getElementById(id)}
function clone(o){return JSON.parse(JSON.stringify(o))}
function esc(t){return String(t==null?'':t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;')}
function len(t){return Array.from(t||'').length}
function today(){var d=new Date();return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)}
function uid(p){return p+Date.now().toString(36)+Math.floor(Math.random()*1e4).toString(36)}
function toast(m){var t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(toast._t);toast._t=setTimeout(function(){t.classList.remove('on')},1700)}
function copyText(t,ok,ng){
  function fb(){try{var ta=document.createElement('textarea');ta.value=t;ta.setAttribute('readonly','');ta.style.cssText='position:fixed;top:0;left:0;opacity:0;font-size:16px';document.body.appendChild(ta);ta.focus();ta.select();ta.setSelectionRange(0,t.length);var r=document.execCommand('copy');document.body.removeChild(ta);r?ok():ng()}catch(e){ng()}}
  if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(t).then(ok,fb)}else{fb()}
}
/* ---- 状態の読み込み・保存 ---- */
function freshAcc(id){var d=DATA[id];return {dv:d.dataVersion||'',items:clone(d.items),decisions:clone(d.decisions),todos:clone(d.todos),hold:clone(d.hold),done:clone(d.done),picks:{},insights:[],f:{st:'',app:'',pl:'',kind:'',q:''},sel:null}}
function load(){
  var o=null;try{o=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){}
  if(!o||!o.acc)o={cur:ACCS[0],acc:{},tab:'home'};
  ACCS.forEach(function(id){if(!o.acc[id])o.acc[id]=freshAcc(id)});
  if(!DATA[o.cur])o.cur=ACCS[0];
  return o;
}
var S=load();
var IS_WEB=/^https?:$/.test(location.protocol);
var DK=['dv','items','decisions','todos','hold','done','picks','insights'];
function pack(){var o={};ACCS.forEach(function(id){var a=S.acc[id],x={};DK.forEach(function(k){x[k]=a[k]});o[id]=x});return {acc:o}}
function seedStr(){var o={};ACCS.forEach(function(id){var a=freshAcc(id),x={};DK.forEach(function(k){x[k]=a[k]});o[id]=x});return JSON.stringify({acc:o})}
function save(){
  try{var pk=JSON.stringify(pack());if(pk!==S._lp){if(S._lp!==undefined)S._dirty=true;S._lp=pk}}catch(e){}
  try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
  if(IS_WEB&&S._dirty&&!S._conf)schedulePush();
}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function setStatus(k,detail){var el=$('sync');if(!el)return;var m={ok:['☁️','同期済み',''],saving:['⏳','保存中',''],off:['⚠️','つながっていません','off'],auth:['⚠️','認証できません','off'],kv:['⚠️','保存場所が未設定','off'],conf:['⚠️','要確認','conf'],local:['💾','この端末だけ','']}[k]||['',''];el.className='sync '+(m[2]||'');el.innerHTML=m[0]+'<span class="st-t"> '+m[1]+'</span>';el.title=m[1]+(detail?'：'+detail:'');el.setAttribute('aria-label','同期の状態：'+m[1]);var bn=$('syncErr');if(bn)bn.innerHTML=(k==='auth'||k==='kv')?'<div class="sbanner"><b>'+m[0]+' '+m[1]+'</b><div class="note">'+esc(detail||'')+'</div></div>':(k==='off'?'<div class="sbanner"><b>'+m[0]+' '+m[1]+'</b><div class="note">この端末には、保存されています。電波のあるところで、もう一度開いてください。</div></div>':'')}
var _pt,_pushing=false;
function schedulePush(){clearTimeout(_pt);setStatus('saving');_pt=setTimeout(push,900)}
async function api(method,body,q){var r=await fetch('api/state'+(q||''),{method:method,headers:{'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined,cache:'no-store',credentials:'same-origin'});var j=null;try{j=await r.json()}catch(e){}return {status:r.status,json:j}}
async function push(){
  if(!IS_WEB||!S._dirty||_pushing||S._conf)return;_pushing=true;
  var sent=JSON.stringify(pack());
  try{
    var r=await api('PUT',{base:S._base||0,data:pack()});
    if(r.status===200){S._base=r.json.rev;if(JSON.stringify(pack())===sent){S._dirty=false;setStatus('ok')}persist();_pushing=false;if(S._dirty)schedulePush();return}
    if(r.status===409){_pushing=false;showConflict(r.json);return}
    setStatus(r.status===401||r.status===403?'auth':r.status===500?'kv':'off',r.json&&(r.json.reason||r.json.error));_pushing=false;setTimeout(push,20000);return;
  }catch(e){setStatus('off');_pushing=false;setTimeout(push,20000)}
}
function adopt(srv){
  ACCS.forEach(function(id){var d=srv.data&&srv.data.acc&&srv.data.acc[id];if(d)DK.forEach(function(k){if(d[k]!==undefined)S.acc[id][k]=d[k]})});
  S._base=srv.rev;S._dirty=false;S._conf=false;S._lp=JSON.stringify(pack());persist();$('syncBanner').innerHTML='';setStatus('ok');render();migrateAll();
}
function showConflict(srv){
  S._conf=true;setStatus('conf');
  $('syncBanner').innerHTML='<div class="sbanner"><b>📣 別の端末で、内容が更新されています</b><div class="note">このまま進めると、どちらかの変更が消えます。どちらにしますか？（迷ったら、先に「データ」で、この端末の内容をコピーして、残しておいてください）</div><div class="row" style="margin-top:8px"><button class="btn sm pri" id="cfLoad">別の端末の内容を読み込む</button><button class="btn sm" id="cfKeep">この端末の内容で上書きする</button></div></div>';
  $('cfLoad').onclick=function(){adopt(srv)};
  $('cfKeep').onclick=function(){S._base=srv.rev;S._conf=false;S._dirty=true;$('syncBanner').innerHTML='';persist();push()};
}
async function pull(){
  if(!IS_WEB||S._conf)return;
  try{
    var r=await api('GET');
    if(r.status===401||r.status===403){setStatus('auth',r.json&&(r.json.reason||r.json.error));return}
    if(r.status===500){setStatus('kv',r.json&&(r.json.reason||r.json.error));return}
    if(r.status!==200){setStatus('off','応答：'+r.status);return}
    var srv=r.json;
    if(!srv.data){migrateAll();S._dirty=true;schedulePush();return}   // サーバーが空：この端末の内容を最初の保存にする
    if(srv.rev===S._base){if(S._dirty)schedulePush();else{setStatus('ok');migrateAll()}return}
    if(srv.rev>(S._base||0)){
      var localEdited=(S._base===undefined&&JSON.stringify(pack())!==seedStr());
      if(S._dirty||localEdited){showConflict(srv);return}
      adopt(srv);
    }
  }catch(e){setStatus('off')}
}
function migrateAll(){
  var any=false;
  ACCS.forEach(function(id){
    var a=S.acc[id],d=DATA[id];
    if((a.dv||'')===(d.dataVersion||''))return;
    (d.migrations||[]).forEach(function(m){

    return '<div class="tli" data-open="'+x.id+'"><div class="tld"><b>'+esc(x.date||'日付なし')+'</b></div><div class="tlb"><div class="top">'+midTag(x)+'<span class="no">'+esc(x.kind)+'</span><span class="pl">'+(PE[x.place]||'')+' '+esc(x.place)+'</span>'+imgBadge(x)+'</div><div class="ti">'+esc(x.topic)+'</div>'+chips+'</div></div>'}).join('')+'</div>';
  $('p-review').innerHTML=h;
}
